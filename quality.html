<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data Quality · Río Santiago Atlas</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="top" id="top"></header>
<div class="layout"><aside class="side" id="side"></aside>
<main>
 <section class="sec" id="heat"><h2 data-t="h_heat"></h2><div class="body">
  <p class="lead" data-t="heat_lead"></p>
  <div class="ctl"><label><span data-t="view"></span><select id="hv"></select></label></div>
  <div class="hm" id="hm"></div><div class="legend" id="hleg"></div>
  <p class="note" data-t="may"></p>
 </div></section>
 <section class="sec" id="hist"><h2 data-t="h_hist"></h2><div class="body">
  <p class="lead" data-t="hist_lead"></p>
  <canvas class="cv" id="hc"></canvas><div class="legend" id="hl"></div>
 </div></section>
 <section class="sec" id="ptable"><h2 data-t="h_tab"></h2><div class="body">
  <p class="lead" data-t="tab_lead"></p>
  <div class="ctl"><label><span data-t="search"></span><input type="search" id="tq" data-ph="phSearch"></label></div>
  <div class="tw" style="max-height:640px"><table class="t" id="tt"></table></div>
 </div></section>
 <section class="sec" id="overview"><h2 data-t="overview"></h2><div class="body" id="ov"></div></section>
</main></div>
<footer class="credit" id="credit"></footer>
<script src="core.js"></script><script src="points.js"></script><script src="common.js"></script>
<script src="quality.js"></script>
</body></html>
