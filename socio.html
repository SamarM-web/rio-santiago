<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Socioeconomic Analysis · Río Santiago Atlas</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="top" id="top"></header>
<div class="layout"><aside class="side" id="side"></aside>
<main>
 <section class="sec" id="map"><h2 data-t="h_map"></h2><div class="body">
  <p class="lead" data-t="map_lead"></p>
  <div class="ctl"><label><span data-t="indicator"></span><select id="mi"></select></label><label><span data-t="period"></span><select id="my"></select></label>
   <label class="row"><input type="checkbox" id="mlm"> <span data-t="landmarks"></span></label>
   <button id="mtop" data-t="topView"></button><button id="mrst" data-t="resetView"></button></div>
  <div class="mapwrap"><div class="mapbox"><canvas id="mcv" style="height:520px"></canvas><div class="hint" data-t="mapHint"></div></div><div class="mcard" id="mcard"></div></div>
  <div class="legend" id="mleg"></div>
 </div></section>
 <section class="sec" id="stab"><h2 data-t="h_stab"></h2><div class="body"><p class="lead" data-t="stab_lead"></p><div class="tw"><table class="t" id="stt"></table></div><p class="small" id="stnote"></p></div></section>
 <section class="sec" id="matrix"><h2 data-t="h_matrix"></h2><div class="body">
  <p class="lead" data-t="matrix_lead"></p>
  <div class="ctl"><label><span data-t="period"></span><select id="xy"></select></label></div>
  <div class="tw" style="max-height:640px"><table class="mx" id="mxt"></table></div>
  <div class="legend"><span><i class="sw" style="background:#c8d8e6"></i> <span data-t="negRho"></span></span><span><i class="sw" style="background:#ecd2b4"></i> <span data-t="posRho"></span></span><span><i class="sw" style="outline:2px solid #14232b;outline-offset:-2px;background:#fff"></i> <span data-t="clearCell"></span></span></div>
  <p class="small" data-t="matrix_note"></p>
 </div></section>
 <section class="sec" id="corr"><h2 data-t="h_corr"></h2><div class="body">
  <p class="lead" data-t="corr_lead"></p>
  <div class="ctl"><label><span data-t="parameter"></span><select id="cp"></select></label><label><span data-t="indicator"></span><select id="ci"></select></label><label><span data-t="period"></span><select id="cy"></select></label><label class="row"><input type="checkbox" id="clog"> <span data-t="logAxis"></span></label></div>
  <div id="cchart"></div><p class="small" id="cnote"></p>
 </div></section>
 <section class="sec" id="profile"><h2 data-t="h_profile"></h2><div class="body">
  <div class="ctl"><label><span data-t="municipality"></span><select id="pm"></select></label></div>
  <div class="mcard" id="pcard"></div>
 </div></section>
 <section class="sec" id="periods"><h2 data-t="h_periods"></h2><div class="body">
  <p class="lead" data-t="periods_lead"></p>
  <div class="ctl"><label><span data-t="search"></span><input type="search" id="pq" data-ph="phMuni"></label></div>
  <div class="tw" style="max-height:520px"><table class="t" id="pt"></table></div>
  <h3 data-t="moranH"></h3><p class="small" data-t="moran_lead"></p><div class="tw"><table class="t" id="mo"></table></div>
 </div></section>
 <section class="sec" id="overview"><h2 data-t="overview"></h2><div class="body" id="ov"></div></section>
</main></div>
<footer class="credit" id="credit"></footer>
<script src="core.js"></script><script src="points.js"></script><script src="common.js"></script><script src="map3d.js"></script>
<script src="socio.js"></script>
</body></html>
